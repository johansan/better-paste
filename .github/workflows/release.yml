name: Release Obsidian plugin

on:
  push:
    tags:
      # Obsidian requires the tag to be the bare version, with no leading "v"
      - '[0-9]+.[0-9]+.[0-9]+'

permissions: read-all

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          cache: npm

      - name: Check and build plugin
        run: |
          npm ci
          CI=1 ./scripts/build.sh

      # A mismatch here means the tag and the manifest disagree, which Obsidian's
      # release checks reject
      - name: Verify manifest version matches the tag
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          manifest="$(node -p "require('./manifest.json').version")"
          if [ "$tag" != "$manifest" ]; then
            echo "Tag $tag does not match manifest version $manifest"
            exit 1
          fi
          echo "Tag and manifest agree on $tag"

      - name: Attest release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"

          # Generate release notes from src/releaseNotes.ts
          node scripts/mdReleaseNotes.js "$tag" > release-notes.md

          # The three files must be individual assets, not a zip, so that Obsidian
          # can fetch them directly
          gh release create "$tag" \
            --title="$tag" \
            --notes-file release-notes.md \
            main.js manifest.json styles.css
