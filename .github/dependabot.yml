version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # typescript-eslint 8 requires typescript >=4.8.4 <6.1.0, so a major
      # typescript bump fails to install.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # eslint-plugin-obsidianmd 0.4.1 requires @eslint/js ^9.30.1, and
      # @eslint/js 10 requires eslint 10, so both fail to install.
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      - dependency-name: '@eslint/js'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
